<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <!-- SEO Meta Tags -->
  <title>KL Attendance Manager | Track LTPS &amp; Academic Status</title>
  <meta name="description"
    content="The ultimate academic assistant for KLU students. Track attendance, calculate LTPS, view academic calendar, and chat with Jarvis AI. Real-time insights for your academic journey." />
  <meta name="keywords"
    content="KL University, KLU, Attendance Manager, LTPS Calculator, Student Portal, Academic Calendar, Jarvis AI" />
  <meta name="author" content="KL Student Developer" />
  <meta name="google-site-verification" content="OC_9TUs3L3oJMZAUiZj5p9T0fWO5RRD3ELmHI3H5wS4" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="KL Attendance Manager | Track LTPS &amp; Academic Status" />
  <meta property="og:description" content="Track your KLU attendance, calculate LTPS, and get AI academic support." />
  <meta property="og:image" content="/vite.svg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="KL Attendance Manager | Track LTPS &amp; Academic Status" />
  <meta property="twitter:description"
    content="Track your KLU attendance, calculate LTPS, and get AI academic support." />

  <!-- PWA Related -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#317EFB">
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- ═══ SPEED CRITICAL: Google Fonts — preconnect first, then non-blocking stylesheet ═══ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- media="print" onload trick: loads font CSS without blocking render -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'" />
  <!-- Fallback for browsers with JS disabled -->
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
  </noscript>

  <!-- ═══ Firebase & API preconnects (DNS + TCP handshake before JS runs) ═══ -->
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://kl-attendance-api.yaswanthadithyareddy10.workers.dev">
  <link rel="preconnect" href="https://kl-attendance-api.yaswanthadithyareddy10.workers.dev" crossorigin>
  <link rel="dns-prefetch" href="https://api.klattendance.online">
  <link rel="preconnect" href="https://api.klattendance.online" crossorigin>

  <!-- ═══ SPEED CRITICAL: Preload Navbar University Logo for 0.1s instant render ═══ -->
  <link rel="preload" as="image" href="/Koneru%20Lakshmaiah%20University%20Logo%20Banner.webp" type="image/webp" fetchpriority="high" />
</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
