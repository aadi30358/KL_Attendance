<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Black Background with rounded squircle -->
  <rect width="512" height="512" rx="108" fill="#0A0A0A"/>
  
  <defs>
    <!-- Neon Lime Gradients -->
    <linearGradient id="neonFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CEFF00"/>
      <stop offset="100%" stop-color="#A6E600"/>
    </linearGradient>
    <linearGradient id="neonShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F9900"/>
      <stop offset="100%" stop-color="#446100"/>
    </linearGradient>
  </defs>

  <!-- 3D Extrusion Shadows for KL -->
  <g fill="url(#neonShadow)">
    <!-- Shadow for K vertical bar -->
    <polygon points="138,162 188,162 204,178 154,178" />
    <polygon points="188,162 188,342 204,358 204,178" />
    <polygon points="138,342 188,342 204,358 154,358" />

    <!-- Shadow for K diagonal arms -->
    <polygon points="188,252 278,162 294,178 204,268" />
    <polygon points="204,268 288,342 272,358 188,284" />

    <!-- Shadow for L vertical & base -->
    <polygon points="274,162 324,162 340,178 290,178" />
    <polygon points="324,162 324,302 340,318 340,178" />
    <polygon points="324,302 378,302 394,318 340,318" />
    <polygon points="274,342 378,342 394,358 290,358" />
    <polygon points="378,302 378,342 394,358 394,318" />
  </g>

  <!-- Front Faces of KL (Isometric 3D Neon Lime) -->
  <g fill="url(#neonFront)" stroke="#0A0A0A" stroke-width="2">
    <!-- K Vertical Stem -->
    <rect x="138" y="162" width="50" height="180" rx="4"/>
    
    <!-- K Top Diagonal -->
    <polygon points="188,258 248,162 284,162 214,268"/>

    <!-- K Bottom Diagonal -->
    <polygon points="204,258 288,342 250,342 180,270"/>

    <!-- L Vertical & Horizontal Bar -->
    <polygon points="274,162 324,162 324,302 378,302 378,342 274,342"/>
  </g>

  <!-- Timetable Grid in the Center -->
  <g transform="translate(222, 230)">
    <!-- Small Timetable Grid Background -->
    <rect x="0" y="0" width="46" height="46" rx="4" fill="#0A0A0A" stroke="#CEFF00" stroke-width="2"/>
    <!-- Grid Header -->
    <rect x="0" y="0" width="46" height="12" rx="3" fill="#CEFF00"/>
    <!-- Grid Lines -->
    <line x1="0" y1="23" x2="46" y2="23" stroke="#CEFF00" stroke-width="2"/>
    <line x1="0" y1="34" x2="46" y2="34" stroke="#CEFF00" stroke-width="2"/>
    <line x1="15" y1="12" x2="15" y2="46" stroke="#CEFF00" stroke-width="2"/>
    <line x1="30" y1="12" x2="30" y2="46" stroke="#CEFF00" stroke-width="2"/>
  </g>
</svg>
