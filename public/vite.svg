<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="timetableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Calendar Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Top Banner Gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Clock Badge Gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="118" fill="url(#timetableBg)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="120" cy="110" r="160" fill="#FFFFFF" opacity="0.12" />
  <circle cx="430" cy="420" r="140" fill="#38BDF8" opacity="0.18" />

  <!-- Binder Rings at the Top -->
  <rect x="156" y="60" width="28" height="54" rx="14" fill="#E2E8F0" />
  <rect x="328" y="60" width="28" height="54" rx="14" fill="#E2E8F0" />

  <!-- Main Timetable Board -->
  <rect x="76" y="86" width="360" height="346" rx="42" fill="url(#boardGrad)" filter="url(#cardShadow)" />

  <!-- Top Red/Rose Calendar Header -->
  <path d="M76 128 C76 104.8 94.8 86 118 86 L394 86 C417.2 86 436 104.8 436 128 L436 160 L76 160 Z" fill="url(#bannerGrad)" />

  <!-- Binder Ring Holes -->
  <circle cx="170" cy="120" r="11" fill="#991B1B" opacity="0.45" />
  <circle cx="170" cy="120" r="8" fill="#FFFFFF" opacity="0.85" />
  <circle cx="342" cy="120" r="11" fill="#991B1B" opacity="0.45" />
  <circle cx="342" cy="120" r="8" fill="#FFFFFF" opacity="0.85" />

  <!-- Week Column Header Dots / Indicators -->
  <rect x="110" y="184" width="60" height="14" rx="7" fill="#CBD5E1" />
  <rect x="188" y="184" width="60" height="14" rx="7" fill="#CBD5E1" />
  <rect x="266" y="184" width="60" height="14" rx="7" fill="#CBD5E1" />
  <rect x="344" y="184" width="58" height="14" rx="7" fill="#CBD5E1" />

  <!-- Timetable Grid Slots (Simulating Class Schedule Matrix) -->
  <!-- Row 1: Mon -->
  <rect x="110" y="214" width="80" height="42" rx="12" fill="#6366F1" />
  <rect x="120" y="226" width="40" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
  <rect x="120" y="238" width="58" height="6" rx="3" fill="#C7D2FE" />

  <rect x="202" y="214" width="128" height="42" rx="12" fill="#3B82F6" />
  <rect x="214" y="226" width="64" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
  <rect x="214" y="238" width="96" height="6" rx="3" fill="#BAE6FD" />

  <rect x="342" y="214" width="60" height="42" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />
  <rect x="354" y="231" width="36" height="7" rx="3.5" fill="#94A3B8" />

  <!-- Row 2: Tue / Wed (with Highlighted Lab / Theory Slot) -->
  <rect x="110" y="268" width="134" height="42" rx="12" fill="#10B981" />
  <rect x="122" y="280" width="72" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
  <rect x="122" y="292" width="102" height="6" rx="3" fill="#A7F3D0" />

  <rect x="256" y="268" width="74" height="42" rx="12" fill="#8B5CF6" />
  <rect x="268" y="280" width="42" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
  <rect x="268" y="292" width="50" height="6" rx="3" fill="#DDD6FE" />

  <rect x="342" y="268" width="60" height="42" rx="12" fill="#F59E0B" />
  <rect x="354" y="280" width="36" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
  <rect x="354" y="292" width="28" height="6" rx="3" fill="#FDE68A" />

  <!-- Row 3: Thu / Fri (Regular Class Blocks) -->
  <rect x="110" y="322" width="70" height="42" rx="12" fill="#0284C7" />
  <rect x="122" y="334" width="36" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
  <rect x="122" y="346" width="46" height="6" rx="3" fill="#BAE6FD" />

  <rect x="192" y="322" width="92" height="42" rx="12" fill="#EC4899" />
  <rect x="204" y="334" width="52" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
  <rect x="204" y="346" width="68" height="6" rx="3" fill="#FBCFE8" />

  <rect x="296" y="322" width="106" height="42" rx="12" fill="#059669" />
  <rect x="308" y="334" width="58" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9" />
  <rect x="308" y="346" width="78" height="6" rx="3" fill="#A7F3D0" />

  <!-- Active Live Schedule Indicator Badge (Clock on Bottom Right) -->
  <g filter="url(#badgeShadow)">
    <circle cx="390" cy="384" r="54" fill="url(#clockGrad)" stroke="#FFFFFF" stroke-width="8" />
    <!-- Clock Face Markers -->
    <circle cx="390" cy="344" r="3" fill="#FFFFFF" />
    <circle cx="430" cy="384" r="3" fill="#FFFFFF" />
    <circle cx="390" cy="424" r="3" fill="#FFFFFF" />
    <circle cx="350" cy="384" r="3" fill="#FFFFFF" />
    <!-- Clock Hands (Indicating 09:40 / Active Lecture) -->
    <path d="M390 384 L390 358" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
    <path d="M390 384 L412 374" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="390" cy="384" r="4.5" fill="#FFFFFF" />
  </g>
</svg>